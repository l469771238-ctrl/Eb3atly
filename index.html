:900}.member-name{font-weight:800;font-size:13px;overflow-wrap:anywhere}.member-phone{font-size:11px;color:var(--muted);margin-top:3px;direction:ltr;text-align:right}.empty{padding:24px 12px;text-align:center;color:var(--muted);font-size:13px;line-height:1.8;border:1px dashed var(--line);border-radius:15px}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:15px}.kpi{border:1px solid var(--line);border-radius:15px;padding:13px;background:var(--panel2)}.kpi strong{display:block;font-size:22px;color:var(--accent);margin-bottom:4px}.kpi span{font-size:11px;color:var(--muted)}.brand-footer{margin-top:28px;text-align:center;color:var(--muted);font-size:11px;line-height:1.8}.hide{display:none!important}.loading{max-width:420px;margin:15vh auto;text-align:center;color:var(--muted)}.loader{width:38px;height:38px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}.toast{position:fixed;z-index:50;bottom:22px;right:50%;transform:translateX(50%);max-width:min(92vw,520px);padding:12px 17px;border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:var(--shadow);backdrop-filter:blur(20px);font-size:13px;animation:rise .2s ease}.foot-links{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:8px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}.section-title h3{margin:0}.code{direction:ltr;text-align:left;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.hr{height:1px;background:var(--line);margin:17px 0}.notice-box{padding:12px 14px;border-radius:14px;background:rgba(139,140,255,.08);border:1px solid rgba(139,140,255,.2);color:var(--muted);font-size:12px;line-height:1.8}.page-enter{animation:rise .25s ease both}

<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand" role="banner">
        <div class="brand-mark" aria-hidden="true">ب</div>
        <div><p class="brand-title">ابعتلي <span style="color:var(--accent2)">|</span> Eb3atly</p><div class="brand-sub">YOUR PRIVATE SPACE</div></div>
      </div>
      <div class="top-actions">
        <button class="ghost-btn" id="homeBtn" type="button">الرئيسية</button>
        <button class="icon-btn" id="themeBtn" type="button" aria-label="تغيير المظهر">☼</button>
      </div>
    </header>
    <main id="app"><div class="loading"><div class="loader"></div>بنجهز مساحتك الخاصة...</div></main>
    <footer class="brand-footer">ابعتلي | Eb3atly <div>هنا المساحة الخاصة — الرسائل تظهر لصاحبها والأدمن المرتبط بها فقط وفق صلاحيات النظام.</div><div class="foot-links"><span>Private by design</span><span>•</span><span>Made for your circle</span></div></footer>
  </div>
  <div id="toast" class="toast hide" role="status" aria-live="polite"></div>
<script>
(() => {
  'use strict';
  const $ = (sel, root=document) => root.querySelector(sel);
  const app = $('#app');
  const config = window.EB3ATLY_CONFIG || {};
  const validConfig = config.supabaseUrl && config.supabasePublishableKey && window.supabase;
  const client = validConfig ? window.supabase.createClient(config.supabaseUrl, config.supabasePublishableKey, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
  }) : null;
  let currentUser = null, profile = null, page = 'home', authMode = 'login', toastTimer = null, refreshing = false;
  const esc = (v='') => String(v).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const date = v => v ? new Date(v).toLocaleString('ar-EG',{dateStyle:'medium',timeStyle:'short'}) : '—';
  const phoneE164 = raw => {
    let s = String(raw||'').replace(/[\s().-]/g,'');
    if(s.startsWith('00')) s='+'+s.slice(2);
    if(s.startsWith('+')) return /^\+[1-9]\d{7,14}$/.test(s) ? s : null;
    s=s.replace(/\D/g,'');
    if(s.startsWith('01') && s.length===11) s='20'+s.slice(1);
    else if(s.startsWith('1') && s.length===10) s='20'+s;
    else if(s.startsWith('20')) s=s;
    else return null;
    return /^\+[1-9]\d{7,14}$/.test('+'+s) ? '+'+s : null;
  };
  const toast = (msg, kind='info') => {
    const t=$('#toast'); t.textContent=msg; t.classList.remove('hide'); t.style.borderColor=kind==='error'?'rgba(255,143,154,.4)':kind==='ok'?'rgba(124,244,177,.35)':'var(--line)';
    clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.add('hide'),4200);
  };
  const line = (msg, kind='info') => `<div class="status-line ${kind}">${esc(msg)}</div>`;
  const noData = msg => `<div class="empty">${esc(msg)}</div>`;
  const avatar = name => `<div class="avatar">${esc((name||'ع').trim().slice(0,1) || 'ع')}</div>`;
  const pill = (label,kind='') => `<span class="pill ${kind}">${esc(label)}</span>`;
  const call = async (promise) => { const {data,error}=await promise; if(error) throw error; return data; };
  const errorText = e => {
    const m=(e && e.message)||'حصل خطأ غير متوقع.';
    if(/Invalid login credentials/i.test(m)) return 'رقم الموبايل أو كلمة المرور غير صحيحين.';
    if(/Phone provider is not enabled/i.test(m)) return 'تسجيل الدخول برقم الموبايل غير مفعّل في إعدادات Supabase بعد.';
    if(/confirmation/i.test(m)) return 'تأكيد رقم الهاتف مفعّل، لكنه يحتاج إعداد مزوّد SMS. راجع تعليمات README قبل التجربة.';
    if(/duplicate key|unique constraint/i.test(m)) return 'رقم الهاتف مسجل بالفعل. جرّب تسجيل الدخول بدل إنشاء حساب جديد.';
    if(/request already exists|reapplication is not allowed|already linked to an admin/i.test(m)) return 'تعذر إكمال الطلب. لو محتاج مساعدة، تواصل مع الأدمن.';
    if(/daily message limit|weekly message limit|monthly message limit|custom message limit/i.test(m)) return 'وصلت للحد المسموح من الرسائل في الفترة الحالية.';
    if(/active membership required|account is not active/i.test(m)) return 'الحساب أو العضوية غير نشطين حاليًا.';
    if(/JWT|schema cache|function/i.test(m)) return 'إعداد في قاعدة البيانات لم يكتمل أو يحتاج مراجعة. افتح لوحة Supabase وراجع إعدادات المشروع.';
    return m;
  };
  async function loadProfile() {
    if(!currentUser) { profile=null; return; }
    const {data,error}=await client.from('profiles').select('*').eq('id',currentUser.id).maybeSingle();
    if(error) throw error;
    profile=data;
  }
  function landing() {
    page='home';
    app.innerHTML=`
      <section class="hero page-enter">
        <div class="hero-copy">
          <span class="eyebrow"><span class="dot"></span> مساحتك الخاصة، على راحتك</span>
          <h1>هنا <span class="gradient-text">المساحة الخاصة</span></h1>
          <p>مكان بسيط تبعت فيه رسالتك للأدمن المرتبط بيك، وتتابع الردود والإشعارات من غير ما رسائلك تظهر لباقي الأعضاء.</p>
          <div class="hero-actions"><button class="primary-btn" data-go="login">دخول</button><button class="secondary-btn" data-go="signup">إنشاء حساب عضو</button></div>
          <div class="small muted" style="margin-top:13px">حساب الأدمن لا يُمنح تلقائيًا عند التسجيل؛ يتم تفعيله بإجراء إداري آمن.</div>
        </div>
        <div class="hero-visual" aria-hidden="true"><div class="orb"></div><div class="floating-card"><div class="small">مساحتك الخاصة · رسالة جديدة</div><div class="bubble">في حاجة حابب أقولها، وبفضّل تبقى بيني وبينك.</div><div class="bubble alt">وصلتني رسالتك، هقرأها وأرد عليك أول ما أقدر.</div><div style="display:flex;align-items:center;justify-content:space-between;margin-top:13px"><span class="small muted">خاص بين الطرفين</span><span style="color:var(--accent);font-size:12px">● مشفّر الاتصال</span></div></div></div>
      </section>
      <section class="features"><div class="feature"><strong>🔒 خصوصية</strong><span>كل عضو يرى رسائله فقط، والأدمن يرى الرسائل المرتبطة بحسابه.</span></div><div class="feature"><strong>📩 رسائل مستقلة</strong><span>كل رسالة لها حالة قراءة ورد خاص بها، وليست محادثة جماعية.</span></div><div class="feature"><strong>✨ بسيط وسريع</strong><span>واجهة مناسبة للموبايل مع الوضع الداكن والفاتح.</span></div></section>
      <section class="panel"><div class="panel-head"><div><h2>ابدأ من هنا</h2><div class="muted small">اختار طريقة الدخول المناسبة ليك.</div></div></div><div class="form-actions"><button class="primary-btn" data-go="login">أنا أدمن</button><button class="secondary-btn" data-go="login">أنا عضو</button></div><div class="notice-box" style="margin-top:17px">تنبيه للنسخة التجريبية: إنشاء الحساب برقم الهاتف يحتاج تفعيل Phone Auth في Supabase. لو أوقفت تأكيد الهاتف لتجنب تكلفة SMS، فالموقع لن يتحقق تلقائيًا من ملكية رقم الهاتف؛ راجع README قبل الإطلاق.</div></section>`;
  }
  function authView(mode='login') {
    page='auth'; authMode=mode;
    const signup=mode==='signup';

ص. لا يوجد تحقق SMS في إعداد النسخة التجريبية، لذلك لا تستخدم كلمة مرور تستعملها في حساباتك الأخرى.</div></section>`;

  function resetPrompt(){
    $('#authMessage').innerHTML=line('استرجاع كلمة المرور للأعضاء من خلال الأدمن لم يُربط بعد في هذه النسخة. ما تبعتش كلمة مرورك في الرسائل؛ هنضيف مسار إعادة تعيين آمن قبل الإطلاق.', 'info');

  async function handleAuthSubmit(form) {
    const fd=new FormData(form), phone=phoneE164(fd.get('phone')), password=String(fd.get('password')||'');
    const submit=$('#authSubmit');
    const msg=$('#authMessage');
    if(!phone){msg.innerHTML=line('اكتب رقم موبايل صحيح. لمصر: 01xxxxxxxxx أو +20xxxxxxxxxx.','error');return;}
    if(password.length<8){msg.innerHTML=line('كلمة المرور لازم تكون 8 أحرف على الأقل.','error');return;}
    submit.disabled=true; submit.textContent='لحظة...'; msg.innerHTML='';
    try{
      if(authMode==='signup'){
        const displayName=String(fd.get('displayName')||'').trim();
        if(!displayName){msg.innerHTML=line('اكتب الاسم اللي هيظهر للأدمن.','error');return;}
        if(password!==String(fd.get('password2')||'')){msg.innerHTML=line('كلمتا المرور مش متطابقتين.','error');return;}
        const {data,error}=await client.auth.signUp({phone,password,options:{data:{display_name:displayName}}});
        if(error) throw error;
        if(!data.session){
          msg.innerHTML=line('تم إنشاء الحساب، لكنه ينتظر تأكيد رقم الهاتف. راجع إعداد Confirm phone ومزوّد SMS في Supabase حسب README.','info');
          return;
        }
        toast('حسابك اتعمل بنجاح. الخطوة التالية طلب الانضمام بكود الأدمن.','ok');
      } else {
        const {error}=await client.auth.signInWithPassword({phone,password});
        if(error) throw error;
        toast('تم تسجيل الدخول.','ok');
      }
      const {data:{user}}=await client.auth.getUser(); currentUser=user; await loadProfile(); await renderDashboard();
    }catch(e){msg.innerHTML=line(errorText(e),'error');}
    finally{submit.disabled=false;submit.textContent=authMode==='signup'?'إنشاء الحساب':'دخول';}
  }

  async function refreshPage(){if(currentUser) await renderDashboard();else landing();}
  async function logout(){if(client) await client.auth.signOut(); currentUser=null;profile=null;landing();toast('تم تسجيل الخروج.');}
  async function markNote(id){await call(client.from('notifications').update({read_at:new Date().toISOString()}).eq('id',id).eq('recipient_id',currentUser.id));await renderDashboard();}
  async function notifyPermission(){if(!('Notification' in window)){toast('المتصفح لا يدعم إشعارات النظام.','error');return;}const p=await Notification.requestPermission();toast(p==='granted'?'تم السماح بإشعارات المتصفح.':'لم يتم السماح بالإشعارات.');if(p==='granted')new Notification('ابعتلي | Eb3atly',{body:'تم تفعيل إشعارات المتصفح أثناء فتح الموقع.'});}
  app.addEventListener('click',async e=>{
    const go=e.target.closest('[data-go]'); if(go){const dest=go.dataset.go;if(dest==='home')landing();else authView(dest==='signup'?'signup':'login');return;}
    const mode=e.target.closest('[data-authmode]'); if(mode){authView(mode.dataset.authmode);return;}
    const b=e.target.closest('[data-action]'); if(!b)return;
    const action=b.dataset.action;
    try{
      if(action==='logout')return await logout();
      if(action==='refresh')return await refreshPage();
      if(action==='forgot')return resetPrompt();
      if(action==='notify-permission')return await notifyPermission();
      if(action==='read-note')return await markNote(b.dataset.id);
      if(action==='generate-invite'){
        if(!window.crypto?.getRandomValues){toast('المتصفح لا يدعم التوليد الآمن للكود.','error');return;}
        const bytes=window.crypto.getRandomValues(new Uint8Array(24));
        const raw=String.fromCharCode(...bytes);
        const code=btoa(raw).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
        const input=$('#inviteAdmin');if(input)input.value=code;
        toast('اتولد كود عشوائي قوي. انسخه واحتفظ به قبل الحفظ.','ok');return;
      }
      if(action==='edit-message'){
        const next=prompt('عدّل رسالتك (متاح طالما الأدمن لم يقرأها):',b.dataset.body||'');
        if(next===null)return;if(!next.trim()){toast('الرسالة لا يمكن أن تكون فارغة.','error');return;}
        const {data,error}=await client.from('messages').update({body:next.trim()}).eq('id',b.dataset.id).eq('member_id',currentUser.id).select('id');
        if(error)throw error;if(!data?.length){toast('لم نتمكن من التعديل؛ يمكن أن الأدمن قرأ الرسالة بالفعل.','error');return;}toast('تم تعديل الرسالة.','ok');return await renderDashboard();
      }
      if(action==='review-request'||action==='review-request-reapply'){
        const id=b.dataset.id,approve=action==='review-request'&&b.dataset.approve==='true',allow=action==='review-request-reapply';
        if(!confirm(approve?'تأكيد قبول العضو؟':'تأكيد رفض الطلب؟'))return;
        await call(client.rpc('review_membership_request',{p_request_id:id,p_approve:approve,p_allow_reapply:allow}));toast(approve?'تم قبول العضو.':'تمت مراجعة الطلب.','ok');return await renderDashboard();
      }
      if(action==='member-status'){
        const status=b.dataset.status;if(!confirm(status==='banned'?'تأكيد حظر العضو؟':status==='suspended'?'إيقاف العضو مؤقتًا؟':'إعادة تفعيل العضو؟'))return;
        await call(client.rpc('set_member_status',{p_member_id:b.dataset.id,p_status:status}));toast('تم تحديث حالة العضوية.','ok');return await renderDashboard();
      }
      if(action==='member-limits'){
        const id=b.dataset.id;const ask=(label)=>{const v=prompt(label+' (اتركه فارغًا لو مفيش حد):');if(v===null)return undefined;if(v.trim()==='')return null;const n=Number(v);return Number.isInteger(n)&&n>=0?n:NaN;};
        const daily=ask('الحد اليومي');if(daily===undefined)return;const weekly=ask('الحد الأسبوعي');if(weekly===undefined)return;const monthly=ask('الحد الشهري');if(monthly===undefined)return;const custom=ask('الحد المخصص');if(custom===undefined)return;
        if([daily,weekly,monthly,custom].some(v=>Number.isNaN(v))){toast('اكتب رقمًا صحيحًا أو اترك الحقل فارغًا.','error');return;}
        let period=null;if(custom!==null){const v=prompt('الفترة المخصصة بالساعات (مثال 48):','24');if(v===null)return;period=Number(v);if(!Number.isInteger(period)||period<=0){toast('الفترة بالساعات لازم تكون عددًا موجبًا.','error');return;}}
        await call(client.rpc('set_member_limits',{p_member_id:id,p_daily_limit:daily,p_weekly_limit:weekly,p_monthly_limit:monthly,p_custom_limit:custom,p_custom_period_hours:period}));toast('تم حفظ حدود الرسائل.','ok');return await renderDashboard();
      }
    }catch(err){toast(errorText(err),'error');}
  });
  app.addEventListener('submit',async e=>{
    const form=e.target;
    try{
      if(form.id==='authForm'){e.preventDefault();return await handleAuthSubmit(form);}
      if(form.id==='joinForm'){
        e.preventDefault();const code=String(new FormData(form).get('inviteCode')||'').trim();if(code.length<8){toast('كود الانضمام لازم يكون 8 أحرف على الأقل.','error');return;}
        await call(client.rpc('submit_join_request',{p_invite_code:code}));toast('طلبك اتبعت للأدمن للمراجعة.','ok');return await renderDashboard();
      }
      if(form.id==='messageForm'){
        e.preventDefault();const body=String(new FormData(form).get('body')||'').trim();if(!body){toast('اكتب الرسالة الأول.','error');return;}
        const membership=await call(client.from('memberships').select('admin_id,status').eq('member_id',currentUser.id).maybeSingle());if(!membership||membership.status!=='active'){toast('العضوية غير نشطة.','error');return;}
        await call(client.rpc('send_message',{p_admin_id:membership.admin_id,p_body:body}));toast('رسالتك اتبعتت.','ok');return await renderDashboard();
      }
      if(form.id==='inviteForm'){
        e.preventDefault();const code=String(new FormData(form).get('inviteCode')||'').trim();if(code.length<8){toast('الكود لازم يكون 8 أحرف على الأقل.','error');return;}
        await call(client.rpc('set_my_invite_code',{p_invite_code:code}));toast('اتحفظ كود الانضمام. احتفظ به في مكان آمن.','ok');form.reset();return;
      }
      if(form.dataset.replyForm){
        e.preventDefault();const reply=String(new FormData(form).get('reply')||'').trim();if(!reply){toast('اكتب الرد الأول.','error');return;}
        await call(client.rpc('reply_to_message',{p_message_id:form.dataset.replyForm,p_reply:reply}));toast('تم إرسال الرد للعضو.','ok');return await renderDashboard();
      }
    }catch(err){toast(errorText(err),'error');}
  });
  $('#themeBtn').addEventListener('click',()=>{const next=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=next;localStorage.setItem('eb3atly-theme',next);$('#themeBtn').textContent=next==='light'?'☾':'☼';});
  $('#homeBtn').addEventListener('click',()=>{if(currentUser)renderDashboard();else landing();});
  const savedTheme=localStorage.getItem('eb3atly-theme')||'dark';document.documentElement.dataset.theme=savedTheme;$('#themeBtn').textContent=savedTheme==='light'?'☾':'☼';
  async function start(){
    if(!validConfig){app.innerHTML=`<section class="panel">${line('ملف إعداد Supabase غير مكتمل. راجع config.js داخل الحزمة.','error')}</section>`;return;}
    try{const {data}=await client.auth.getSession();currentUser=data.session?.user||null;await renderDashboard();}
    catch(e){app.innerHTML=`<section class="panel">${line(errorText(e),'error')}<button class="primary-btn" data-go="home">الرئيسية</button></section>`;}
    client.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_IN'||event==='SIGNED_OUT'||event==='TOKEN_REFRESHED'){setTimeout(async()=>{currentUser=session?.user||null;try{await renderDashboard();}catch(e){toast(errorText(e),'error');}},0);}});
  }
  start();
  if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
</body>
</html>
